[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benkinew-superbench"
version = "0.4.0"
description = "Reproducible benchmark for AI coding agents on real anonymized incidents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "BenkiNew"}]
dependencies = []

[project.scripts]
superbench = "superbench.cli:main"

[tool.setuptools.packages.find]
include = ["superbench*"]

