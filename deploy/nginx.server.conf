server {
    listen 443 ssl;
    server_name superbench.cloud.lan;
    server_tokens off;

    allow 127.0.0.1;
    allow ::1;
    allow 100.64.0.0/10;
    allow fd7a:115c:a1e0::/48;
    deny all;

    ssl_certificate     /etc/nginx/standby.pem;
    ssl_certificate_key /etc/nginx/standby.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    root /home/benkigeek/projects-new/superbench/site;
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
