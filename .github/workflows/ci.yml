name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
      - name: Tests and deterministic render
        run: ./scripts/ci.sh
      - name: Verify generated portal is committed
        run: git diff --exit-code -- site
